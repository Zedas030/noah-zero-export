# Helpers the automations need. Include them in configuration.yaml, for example:
#   input_number: !include_dir_merge_named ...   or put the blocks there directly.
# Alternatively create them in the UI under Settings -> Devices & services -> Helpers.

input_number:
  noah_last_setpoint:
    name: NOAH last setpoint
    min: 0
    max: 800
    step: 1
    unit_of_measurement: W
    mode: box

input_boolean:
  noah_soc_diff_warning:
    name: NOAH SoC difference warning active
    icon: mdi:battery-alert

# A sensor sensor.house_consumption is also expected (current household power in W).
# Where it comes from doesn't matter: smart meter reader, sum of metering plugs, template sensor.
# Example of a template sensor from grid import and NOAH output:
#
# template:
#   - sensor:
#       - name: House consumption
#         unique_id: house_consumption
#         unit_of_measurement: W
#         device_class: power
#         state_class: measurement
#         state: >
#           {{ (states('sensor.power_meter_power') | float(0)
#               + states('sensor.noah_2000_output_power') | float(0)) | round(0) }}
