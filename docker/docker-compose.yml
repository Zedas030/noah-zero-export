services:
  # Reads the NOAH via the Growatt cloud and exposes it over MQTT (with Home Assistant discovery).
  # Project: https://github.com/mtrossbach/noah-mqtt
  noah-mqtt:
    image: ghcr.io/mtrossbach/noah-mqtt:latest
    container_name: noah-mqtt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: "Europe/Berlin"
      MQTT_HOST: "${MQTT_HOST}"
      MQTT_PORT: "1883"
      GROWATT_API_MODE: "web+app"
      LOG_LEVEL: "INFO"
      POLLING_INTERVAL: "60"
      BATTERY_DETAILS_POLLING_INTERVAL: "300"
      PARAMETER_POLLING_INTERVAL: "300"

  # Optional: emulates a smart meter (EcoTracker) on the LAN and feeds it from the MQTT topic home/house_consumption.
  # Project: https://github.com/sdeigm/uni-meter
  uni-meter:
    image: sdeigm/uni-meter:latest
    container_name: uni-meter
    environment:
      TZ: "Europe/Berlin"
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./uni-meter/uni-meter.conf:/etc/uni-meter.conf
